name: NTParts Quality Gate

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --runInBand

      - name: Catalog validation
        run: npm run validate:catalog

      - name: Production build
        run: npm run build
