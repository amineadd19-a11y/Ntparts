name: NTParts Quality Gate

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Complete production quality gate
        run: npm run quality-gate
